name: Daily Discord Tip

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  post-tip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/post-daily-tip.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
